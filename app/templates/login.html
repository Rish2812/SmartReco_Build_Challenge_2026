{% extends "base.html" %}
{% block title %}Log in — SmartReco{% endblock %}
{% block content %}
  <div class="auth-wrap">
    <div class="form-card">
      <span class="eyebrow">✦ Welcome</span>
      <h2 id="formTitle">Log in</h2>
      <div class="subhead" id="formSubhead">Pick up where your recommendations left off.</div>

      <div class="error-banner" id="errorBanner" style="display:none;"></div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        <div class="field-hint error" id="emailHint" style="display:none;"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="field-input-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="toggle-pw" id="togglePw">Show</button>
        </div>
        <div class="field-hint" id="pwHint">At least 6 characters</div>
      </div>

      <button type="button" class="submit-btn" id="submitBtn">Log in</button>

      <div class="switch">
        <span id="switchPrompt">New here?</span>
        <a id="switchLink">Create an account</a>
      </div>
    </div>
  </div>

  <script>
    let mode = 'login';
    const emailEl = document.getElementById('email');
    const pwEl = document.getElementById('password');
    const errorBanner = document.getElementById('errorBanner');
    const emailHint = document.getElementById('emailHint');
    const pwHint = document.getElementById('pwHint');
    const submitBtn = document.getElementById('submitBtn');

    document.getElementById('togglePw').addEventListener('click', () => {
      const isPw = pwEl.type === 'password';
      pwEl.type = isPw ? 'text' : 'password';
      document.getElementById('togglePw').textContent = isPw ? 'Hide' : 'Show';
    });

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('formTitle').textContent = mode === 'login' ? 'Log in' : 'Create account';
      document.getElementById('formSubhead').textContent = mode === 'login'
        ? 'Pick up where your recommendations left off.'
        : 'Takes about 20 seconds — browse a bit and we start learning your interests.';
      submitBtn.textContent = mode === 'login' ? 'Log in' : 'Sign up';
      document.getElementById('switchPrompt').textContent = mode === 'login' ? 'New here?' : 'Already have an account?';
      document.getElementById('switchLink').textContent = mode === 'login' ? 'Create an account' : 'Log in';
      pwHint.textContent = mode === 'register' ? 'At least 6 characters' : '';
      hideError();
    }
    document.getElementById('switchLink').addEventListener('click', () => setMode(mode === 'login' ? 'register' : 'login'));

    function hideError() {
      errorBanner.style.display = 'none';
      emailHint.style.display = 'none';
      emailEl.classList.remove('invalid');
      pwEl.classList.remove('invalid');
    }

    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.style.display = 'block';
    }

    // Parses both FastAPI's simple {"detail": "message"} errors AND pydantic's
    // validation-error array format {"detail": [{"msg": "...", "loc": [...]}]}.
    function extractErrorMessage(errBody) {
      const detail = errBody && errBody.detail;
      if (!detail) return 'Something went wrong. Please try again.';
      if (typeof detail === 'string') return detail;
      if (Array.isArray(detail)) {
        return detail.map(d => d.msg || JSON.stringify(d)).join(' ');
      }
      return 'Something went wrong. Please try again.';
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.innerHTML = isLoading
        ? `<span class="spinner"></span> ${mode === 'login' ? 'Logging in…' : 'Creating account…'}`
        : (mode === 'login' ? 'Log in' : 'Sign up');
    }

    async function submit() {
      hideError();
      const email = emailEl.value.trim();
      const password = pwEl.value;

      if (!email || !email.includes('@')) {
        emailEl.classList.add('invalid');
        emailHint.textContent = 'Enter a valid email address.';
        emailHint.style.display = 'block';
        return;
      }
      if (mode === 'register' && password.length < 6) {
        pwEl.classList.add('invalid');
        showError('Password must be at least 6 characters.');
        return;
      }
      if (!password) {
        pwEl.classList.add('invalid');
        showError('Password is required.');
        return;
      }

      setLoading(true);
      try {
        let res;
        if (mode === 'register') {
          res = await fetch('/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
        } else {
          const form = new URLSearchParams();
          form.append('username', email);
          form.append('password', password);
          res = await fetch('/auth/token', { method: 'POST', body: form });
        }

        const data = await res.json();
        if (!res.ok) throw new Error(extractErrorMessage(data));

        Auth.setSession(data.access_token, data.user);
        window.location.href = data.user.role === 'admin' ? '/admin' : '/dashboard';
      } catch (err) {
        showError(err.message || 'Something went wrong. Please try again.');
        setLoading(false);
      }
    }

    submitBtn.addEventListener('click', submit);
    pwEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    emailEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') pwEl.focus(); });
    emailEl.addEventListener('input', hideError);
    pwEl.addEventListener('input', hideError);
  </script>
{% endblock %}
